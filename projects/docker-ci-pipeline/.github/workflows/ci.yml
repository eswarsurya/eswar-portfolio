name: CI
on:
  push:
    paths:
      - 'projects/docker-ci-pipeline/**'
  pull_request:
    paths:
      - 'projects/docker-ci-pipeline/**'
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/docker-ci-pipeline
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest -v
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build container image
        uses: docker/build-push-action@v6
        with:
          context: projects/docker-ci-pipeline
          push: false
          tags: sample-health-api:ci